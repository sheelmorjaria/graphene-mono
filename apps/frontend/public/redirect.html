<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphene Security - Redirecting</title>
    <script>
        // Convert legacy HashRouter URLs (/#/path) to clean BrowserRouter paths.
        // Fragments never reach the server, so this file is only useful if
        // something explicitly links to /redirect.html.
        if (window.location.hash.startsWith('#/')) {
            window.location.replace(window.location.hash.slice(1));
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
