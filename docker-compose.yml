# Docker Compose configuration for CapRover monorepo deployment
# Deploy this entire stack as one application in CapRover
version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: graphene-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - COIN_GECKO_API_KEY=${COIN_GECKO_API_KEY}
      - BLOCKONOMICS_CALLBACK_SECRET=${BLOCKONOMICS_CALLBACK_SECRET}
      - GLOBEE_API_KEY=${GLOBEE_API_KEY}
      - GLOBEE_API_SECRET=${GLOBEE_API_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@grapheneosstore.com}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-support@graphene-security.com}
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    labels:
      - "captain.id=graphene-backend"
      - "captain.image=ghcr.io/sheelmorjaria/graphene-backend"
      - "captain.port=5000"
      - "captain.healthCheckPath=/health"
      - "captain.containerHttpPort=5000"

  # Frontend Web Service
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.coolify
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_APP_TITLE=${VITE_APP_TITLE:-GrapheneOS Store}
        - VITE_COMPANY_NAME=${VITE_COMPANY_NAME:-Graphene Security}
        - VITE_SUPPORT_EMAIL=${VITE_SUPPORT_EMAIL:-support@graphene-security.com}
        - VITE_ENABLE_PAYPAL_PAYMENTS=${VITE_ENABLE_PAYPAL_PAYMENTS:-true}
        - VITE_ENABLE_BITCOIN_PAYMENTS=${VITE_ENABLE_BITCOIN_PAYMENTS:-true}
        - VITE_ENABLE_MONERO_PAYMENTS=${VITE_ENABLE_MONERO_PAYMENTS:-false}
        - VITE_ENABLE_DEV_TOOLS=${VITE_ENABLE_DEV_TOOLS:-false}
    container_name: graphene-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    labels:
      - "captain.id=graphene-frontend"
      - "captain.image=ghcr.io/sheelmorjaria/graphene-frontend"
      - "captain.port=3000"
      - "captain.containerHttpPort=3000"
      - "captain.redirectDomain=www.graphene-security.com"

volumes:
  backend-uploads:
    driver: local
  backend-logs:
    driver: local

networks:
  default:
    name: graphene-network
