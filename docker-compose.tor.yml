version: '3.8'

services:
  # Tor Service - Provides onion addresses for frontend and backend
  tor:
    image: goldy/tor-hidden-service:latest
    container_name: graphene-tor
    restart: unless-stopped
    environment:
      # Frontend hidden service
      GRAPHENE_FRONTEND_PORTS: "80:80"
      GRAPHENE_FRONTEND_SERVICE: "frontend:8080"
      
      # Backend API hidden service  
      GRAPHENE_BACKEND_PORTS: "80:80"
      GRAPHENE_BACKEND_SERVICE: "backend:5000"
      
      # MongoDB hidden service (optional, for remote admin)
      # GRAPHENE_MONGO_PORTS: "27017:27017"
      # GRAPHENE_MONGO_SERVICE: "mongodb:27017"
    volumes:
      - tor_keys:/var/lib/tor/hidden_service/
      - ./tor/torrc:/etc/tor/torrc:ro
    networks:
      - graphene-network
    healthcheck:
      test: ["CMD", "curl", "--socks5", "localhost:9050", "--socks5-hostname", "localhost:9050", "check.torproject.org"]
      interval: 60s
      timeout: 15s
      retries: 3

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: graphene-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-graphene_store}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - graphene-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: graphene-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - graphene-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Service with Tor support
  backend:
    build:
      context: ./apps/backend
      target: production
    container_name: graphene-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-graphene_store}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      
      # Payment Configuration
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-production}
      BLOCKONOMICS_API_KEY: ${BLOCKONOMICS_API_KEY}
      BLOCKONOMICS_WEBHOOK_SECRET: ${BLOCKONOMICS_WEBHOOK_SECRET}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET}
      
      # AWS (Optional for Tor - consider privacy implications)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      
      # URLs - Will be set after getting onion addresses
      FRONTEND_URL: ${TOR_FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${TOR_BACKEND_URL:-http://localhost:5000}
      
      # Tor-specific settings
      ENABLE_TOR: "true"
      TRUST_PROXY: "true"
      CORS_ALLOW_ONION: "true"
      
      # Security for Tor
      DISABLE_ANALYTICS: "true"
      DISABLE_EXTERNAL_SCRIPTS: "true"
      ENHANCED_PRIVACY_MODE: "true"
      
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - graphene-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service with Tor optimizations
  frontend:
    build:
      context: ./apps/frontend
      target: production
      args:
        VITE_API_URL: ${TOR_BACKEND_URL:-http://backend:5000}
        VITE_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
        VITE_ENVIRONMENT: production
        VITE_ENABLE_TOR: "true"
        VITE_DISABLE_ANALYTICS: "true"
    container_name: graphene-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENABLE_TOR: "true"
    networks:
      - graphene-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx for Tor (simplified configuration)
  nginx-tor:
    image: nginx:alpine
    container_name: graphene-nginx-tor
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-tor.conf:/etc/nginx/nginx.conf:ro
    networks:
      - graphene-network
    depends_on:
      - frontend
      - backend

  # Tor Browser Bundle compatible proxy (optional)
  privoxy:
    image: vimagick/privoxy
    container_name: graphene-privoxy
    restart: unless-stopped
    ports:
      - "8118:8118"
    volumes:
      - ./tor/privoxy.conf:/etc/privoxy/config:ro
    networks:
      - graphene-network
    depends_on:
      - tor

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  tor_keys:
    driver: local

networks:
  graphene-network:
    driver: bridge